name: Test Personal New Episodes Addon

on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-new-episodes/**'
      - '.github/workflows/new-episodes-test.yml'
  push:
    branches: [main]
    paths:
      - 'personal-new-episodes/**'
      - '.github/workflows/new-episodes-test.yml'

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix personal-new-episodes
