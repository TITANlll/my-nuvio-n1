name: Publish My Nuvio Build N1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '26 5 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nuvio-pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork test dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_artifact: ${{ steps.artifact_name.outputs.name }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install Netflix poster renderer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate verified catalogs
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: python generate.py
      - name: Select Pages artifact for this build attempt
        id: artifact_name
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: ${{ needs.build.outputs.pages_artifact }}
        with:
          script: |
            const artifactName = process.env.PAGES_ARTIFACT;
            for (let attempt = 0; attempt < 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: context.runId
              });
              if (artifacts.some(a => a.name === artifactName && !a.expired)) return;
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact metadata was not available within 60 seconds. Retry the failed deployment job.');
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live manifest and catalog routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          version=$(python -c 'import generate; print(generate.ADDON_VERSION)')
          for attempt in 1 2 3 4; do
            if python verify_site.py "$PAGE_URL" --expected-version "$version"; then
              exit 0
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 15
          done
